name: Continuous delivery - Linux (x64)

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [prereleased, released]
  workflow_dispatch:

env:
  POETRY_SPEC: poetry >=2,<3

jobs:
  check-version-tag:
    name: Check version tag
    runs-on: ubuntu-latest
    container: python:3.11-slim
    if: github.event_name == 'release'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install dependencies
        run: pip install toml-cli
      - name: Check version tag
        shell: bash
        run: |
          PYPROJECT_VERSION="v$(toml get --toml-path pyproject.toml project.version)"
          TAG_VERSION="${{ github.event.release.tag_name }}"
          if [ $PYPROJECT_VERSION == $TAG_VERSION ]; then exit 0; else exit 1; fi
  build-onefile:
    name: Build onefile
    runs-on: ubuntu-latest
    container: python:3.11-slim-bookworm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install required packages
        run: |
          apt update
          apt install -y binutils \
            libglib2.0-dev \
            libgl-dev \
            libegl-dev \
            libxkbcommon-x11-dev \
            libxcb-cursor-dev \
            libxcb-icccm4-dev \
            libxcb-image0-dev \
            libxcb-keysyms1-dev \
            libxcb-render-util0-dev \
            libxcb-shape0-dev \
            libxcb-xkb-dev \
            libdbus-1-dev \
            libwayland-dev \
            libgtk-3-dev \
            libatk1.0-dev \
            libpangocairo-1.0-0 \
            libpango1.0-dev \
            make
          pip install "${POETRY_SPEC}"
      - name: Create virtual environment
        run: poetry install
      - name: Build
        run: make build-pyinstaller-onefile
      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: nitrokey-app2-onefile
          path: dist/nitrokey-app2
  publish-binary:
    name: Publish binary
    runs-on: ubuntu-latest
    container: python:3.11-slim-bookworm
    needs: [build-onefile, check-version-tag]
    if: github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: nitrokey-app2-onefile
      - name: Rename binary
        run: |
          mv \
            nitrokey-app2 \
            nitrokey-app2-${{ github.event.release.tag_name }}-x64-linux-binary
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: nitrokey-app2-${{ github.event.release.tag_name }}-x64-linux-binary
